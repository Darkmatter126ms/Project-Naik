# Render Blueprint — provisions the Naik API web service and a managed Postgres
# database, and wires DATABASE_URL from the DB into the service automatically
# (so there is no manual "paste the connection string" step).
#
# Deploy:  Render Dashboard → New → Blueprint → pick this repo. Render reads
# this file, creates both resources, and links them.
#
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: naik-api
    runtime: python
    plan: free
    # `api` is an importable package from the repo root; build/start reference it.
    buildCommand: pip install -r api/requirements.txt
    startCommand: gunicorn api.wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: APP_VERSION
        value: "0.1.0"
      # "*" for the public /health proof. Tighten to your Vercel URL for prod,
      # e.g. https://naik-web.vercel.app
      - key: CORS_ORIGINS
        value: "*"
      # NAIK_FORCE_HEURISTIC: set "true" to skip OpenAI calls entirely (fast offline
      # demo, no API cost). "false" uses gpt-4o-mini with a 15-second per-call
      # timeout — if the call is slow it falls back to heuristic Bahasa automatically.
      - key: NAIK_FORCE_HEURISTIC
        value: "false"
      # Injected from the database below — no manual copy/paste required.
      - key: DATABASE_URL
        fromDatabase:
          name: naik-db
          property: connectionString

databases:
  - name: naik-db
    plan: free
    databaseName: naik
    user: naik
